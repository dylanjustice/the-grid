name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-synthetics:
    name: Playwright synthetics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: playwright-synthetics/.nvmrc
      - name: Install dependencies
        working-directory: playwright-synthetics
        run: npm ci
      - name: Install Playwright browsers
        working-directory: playwright-synthetics
        run: npx playwright install --with-deps chromium
      - name: Run tests
        working-directory: playwright-synthetics
        run: npx playwright test
