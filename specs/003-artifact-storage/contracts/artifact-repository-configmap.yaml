# artifact-repository-configmap.yaml
#
# This is the schema for the ConfigMap the operator generates.
# Name: <synthetictest-name>-artifact-repository
# Namespace: same as SyntheticTest (e.g. the-grid-synthetics)
#
# The operator uses ctrl.SetControllerReference so this ConfigMap is
# garbage-collected when its SyntheticTest is deleted.
#
# Two variants are shown: static credentials and IAM delegation.
# The operator renders the correct variant based on ArtifactStorageSpec.

---
# Variant A: Static credentials (credentialsSecret is set)
apiVersion: v1
kind: ConfigMap
metadata:
  name: <synthetictest-name>-artifact-repository
  namespace: the-grid-synthetics
data:
  default: |
    s3:
      bucket: <ArtifactStorageSpec.Bucket>
      # endpoint: omit for AWS S3; set for MinIO or GCS S3-interop
      endpoint: <ArtifactStorageSpec.Endpoint>          # omit key if empty
      region: <ArtifactStorageSpec.Region>              # omit key if empty
      insecure: false
      accessKeySecret:
        name: <ArtifactStorageSpec.CredentialsSecret>
        key: accessKey
      secretKeySecret:
        name: <ArtifactStorageSpec.CredentialsSecret>
        key: secretKey
      keyFormat: >-
        {{workflow.labels["the-grid.io/synthetic-test"]}}/{{workflow.name}}/playwright-report

---
# Variant B: IAM delegation (serviceAccountAnnotations is non-empty)
apiVersion: v1
kind: ConfigMap
metadata:
  name: <synthetictest-name>-artifact-repository
  namespace: the-grid-synthetics
data:
  default: |
    s3:
      bucket: <ArtifactStorageSpec.Bucket>
      endpoint: <ArtifactStorageSpec.Endpoint>          # omit key if empty
      region: <ArtifactStorageSpec.Region>              # omit key if empty
      insecure: false
      useSDKCreds: true
      keyFormat: >-
        {{workflow.labels["the-grid.io/synthetic-test"]}}/{{workflow.name}}/playwright-report
