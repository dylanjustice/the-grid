apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "the-grid-synthetics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "the-grid-synthetics.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "the-grid-synthetics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "the-grid-synthetics.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "the-grid-synthetics.fullname" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.operator.image }}
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --runner-image={{ .Values.runner.image }}
            - --pushgateway-url={{ include "the-grid-synthetics.pushgatewayURL" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
