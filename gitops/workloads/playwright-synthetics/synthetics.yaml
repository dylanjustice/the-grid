apiVersion: thegrid.io/v1alpha1
kind: SyntheticTest
metadata:
  labels:
  name: httbin-synthetic
  namespace: the-grid-synthetics
spec:
  schedule: "*/5 * * * *"
  entrypoint: run
  container:
    name: playwright
    env:
      - name: PUSHGATEWAY_URL
        value: "http://playwright-synthetics-prometheus-pushgateway.the-grid-synthetics.svc.cluster.local:9091"
      - name: GRID_ENV
        value: "production"
      - name: GRID_JOB_NAME
        value: "httpbin-synthetic"
  artifactStorage:
    enabled: true
    bucket: 393657359434-us-east-2-artifacts
    endpoint: s3.amazonaws.com
    region: us-east-2
    useSDKCreds: true
  source:
    inline: |
      import { test, expect } from "@playwright/test";

      test.beforeEach(async ({ page }) => {
        await page.goto("http://httpbin.the-grid-synthetics.svc.cluster.local", { waitUntil: "networkidle" });
      });

      test("HTTP Methods", async ({ page }) => {
        await page.locator("#operations-tag-HTTP_Methods").click();

        await test.step("DELETE", async () => {
          const op = page.locator('[id="operations-HTTP Methods-delete_delete"]');
          await op.waitFor();
          await op.click();
          await op.locator("button", { hasText: "Try it out" }).click();
          await op.locator("button", { hasText: "Execute" }).click();
          await expect(op.locator("td.response-col_status:not(.col_header)").first()).toHaveText("200");
        });

        await test.step("GET", async () => {
          const op = page.locator('[id="operations-HTTP Methods-get_get"]');
          await op.click();
          await op.locator("button", { hasText: "Try it out" }).click();
          await op.locator("button", { hasText: "Execute" }).click();
          await expect(op.locator("td.response-col_status:not(.col_header)").first()).toHaveText("200");
        });

        await test.step("PATCH", async () => {
          const op = page.locator('[id="operations-HTTP Methods-patch_patch"]');
          await op.click();
          await op.locator("button", { hasText: "Try it out" }).click();
          await op.locator("button", { hasText: "Execute" }).click();
          await expect(op.locator("td.response-col_status:not(.col_header)").first()).toHaveText("200");
        });

        await test.step("POST", async () => {
          const op = page.locator('[id="operations-HTTP Methods-post_post"]');
          await op.click();
          await op.locator("button", { hasText: "Try it out" }).click();
          await op.locator("button", { hasText: "Execute" }).click();
          await expect(op.locator("td.response-col_status:not(.col_header)").first()).toHaveText("200");
        });

        await test.step("PUT", async () => {
          const op = page.locator('[id="operations-HTTP Methods-put_put"]');
          await op.click();
          await op.locator("button", { hasText: "Try it out" }).click();
          await op.locator("button", { hasText: "Execute" }).click();
          await expect(op.locator("td.response-col_status:not(.col_header)").first()).toHaveText("200");
        });
      });
---
apiVersion: thegrid.io/v1alpha1
kind: SyntheticTest
metadata:
  labels:
  name: httbin-synthetic-failure
  namespace: the-grid-synthetics
spec:
  schedule: "*/5 * * * *"
  entrypoint: run
  container:
    name: playwright
    env:
      - name: PUSHGATEWAY_URL
        value: "http://playwright-synthetics-prometheus-pushgateway.the-grid-synthetics.svc.cluster.local:9091"
      - name: GRID_ENV
        value: "production"
      - name: GRID_JOB_NAME
        value: "httpbin-synthetic-failure"
  artifactStorage:
    enabled: true
    bucket: 393657359434-us-east-2-artifacts
    endpoint: s3.amazonaws.com
    region: us-east-2
    useSDKCreds: true
  source:
    inline: |
      import { test, expect } from "@playwright/test";

      test("intentional failure - screenshot capture check", async ({ page }) => {
        await page.goto("http://localhost:8080");
        await expect(page.locator("h1")).toHaveText("this text will never match");
      });

---
